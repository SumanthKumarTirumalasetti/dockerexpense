networks:
  expense:

volumes:
  mysql:

services:
  mysql:
    image: mysql:1.0.0
    volumes:
      -mysql: /var/lib/mysql
    container_name: mysql
    network:
      - expense
  
  backend:
    image: backend:1.0.0
    container_name: backend
    depends_on:
      - mysql
    network:
      - expense

  frontend:
    image: frontend:1.0.0
    container_name: frontend
    network:
      - expense
    ports:
      - 80:8080
    

