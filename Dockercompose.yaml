networks:
  expense: {}

volumes:
  mysql: 

services:
  mysql:
    image: sumanth7696/mysql:1.0.0
    volumes:
      - mysql:/var/lib/mysql
    container_name: mysql
    networks:
      - expense
  
  backend:
    image: sumanth7696/backend:1.0.0
    command: sh -c "sleep 10 && node /opt/backend/index.js" 
    container_name: backend
    depends_on:
      - mysql
    networks:
      - expense

  frontend:
    image: sumanth7696/frontend:1.0.0
    container_name: frontend
    networks:
      - expense
    ports:
      - 80:8080
    depends_on:
      - backend
    

